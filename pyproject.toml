[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bazi-analysis-system"
version = "1.0.0"
description = "AI-assisted Bazi analysis web application"
readme = "产品说明.md"
requires-python = ">=3.8"
dependencies = [
    "Flask>=3.1.1",
    "Flask-CORS>=6.0.0",
    "requests>=2.32.4",
    "openai>=1.0.0",
    "google-generativeai>=0.8.5",
    "mcp>=1.9.3",
    "numpy>=2.3.0",
    "python-dateutil>=2.9.0",
    "lunardate>=0.2.2",
    "python-dotenv>=1.1.0",
    "portalocker>=2.10.1",
    "pytz>=2025.2",
    "reportlab>=4.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]
production = [
    "gunicorn>=23.0.0",
]
all = [
    "bazi-analysis-system[dev,production]",
]

[project.scripts]
bazi-analysis = "app_simplified:main"
bazi-config = "config:check_config_health"

[tool.setuptools]
py-modules = [
    "ai_analyzer",
    "app_simplified",
    "auth_manager",
    "bazi_client",
    "china_locations",
    "config",
    "feature_flags",
    "liuyao_logic",
    "local_bazi_calculator",
    "memory_manager",
    "memory_organizer",
    "pdf_report",
    "prompt_templates",
    "qimen_logic",
    "solar_time",
    "user_manager",
    "ziwei_client",
]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | local_data
  | logs
)/
'''

[tool.flake8]
max-line-length = 88
select = ["E", "F", "W", "C"]
ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    ".venv",
    "local_data",
    "logs",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "flask",
    "flask_cors",
    "google.generativeai.*",
    "openai.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
