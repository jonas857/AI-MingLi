<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>奇门遁甲排盘 | 八字命理分析</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans SC", sans-serif; background: #0b0b0b; color: #f2f2f2; }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 24px; }
      .card { background: #121212; border: 1px solid #2a2a2a; border-radius: 16px; padding: 18px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      input[type="text"], input[type="datetime-local"] { padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2a2a; background: #0f0f0f; color: #f2f2f2; outline: none; }
      input[type="text"] { flex: 1; min-width: 240px; }
      button { padding: 12px 14px; border-radius: 10px; border: 1px solid #3a3a3a; background: #1a1a1a; color: #f2f2f2; cursor: pointer; }
      button:disabled { opacity: .55; cursor: not-allowed; }
      label { display: inline-flex; gap: 8px; align-items: center; color: #d0d0d0; }
      .stage { width: 560px; height: 315px; max-width: 100%; background: #000; border-radius: 16px; overflow: hidden; position: relative; margin: 16px auto 0; border: 1px solid #2a2a2a; }
      .stage video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
      .spinner { width: 64px; height: 64px; border-radius: 999px; border: 4px solid #ff9900; border-top-color: transparent; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .fade-in { animation: fadeIn .28s ease-out both; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 1px solid #2a2a2a; background: #0f0f0f; }
      .muted { color: #b8b8b8; }
      .grid9 { display: grid; grid-template-columns: repeat(3, 1fr); width: min(560px, 100%); margin: 12px auto 0; border: 2px solid #f2f2f2; }
      .cell { aspect-ratio: 1 / 1; border: 1px solid #f2f2f2; padding: 10px; background: linear-gradient(135deg, #0a0a0a, #151515); opacity: 0; transform: scale(.9); }
      .cell.in { opacity: 1; transform: scale(1); transition: opacity .35s ease-out, transform .35s ease-out; }
      .cell:hover { transform: scale(1.01); transition: transform .18s ease-out; }
      .cell-top { text-align: center; height: 18px; color: #cccccc; font-size: 13px; }
      .cell-main { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; margin-top: 10px; }
      .stem { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
      .meta { display: grid; gap: 6px; }
      .meta div { font-size: 13px; color: #d6d6d6; }
      .corner { text-align: right; }
      .palace { font-size: 24px; font-weight: 900; }
      .wuxing { font-size: 12px; color: #b8b8b8; }
      .back-btn { margin-bottom: 14px; display: inline-block; color: #aaa; text-decoration: none; }
      .back-btn:hover { color: #fff; }

      /* Chat Window Styles - 黑色主题 */
      .chat-container {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        height: 60vh;
        min-height: 400px;
      }
      .chat-header {
        padding: 12px 18px;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .chat-title {
        font-weight: 600;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #f2f2f2;
      }
      .chat-modes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chat-modes .mode-btn {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid #3a3a3a;
        background: transparent;
        font-size: 12px;
        color: #9CA3AF;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .chat-modes .mode-btn.active {
        border-color: rgba(59,130,246,0.5);
        background: rgba(59,130,246,0.15);
        color: #f2f2f2;
        font-weight: 600;
      }
      .chat-body {
        flex-grow: 1;
        overflow-y: auto;
        padding: 18px;
        background: #121212;
      }
      .message-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-height: 360px;
        overflow-y: auto;
      }
      .message {
        display: flex;
        flex-direction: column;
        max-width: 85%;
      }
      .message.user {
        align-self: flex-end;
        align-items: flex-end;
      }
      .message.assistant {
        align-self: flex-start;
        align-items: flex-start;
      }
      .message-bubble {
        padding: 12px 16px;
        border-radius: 14px;
        line-height: 1.6;
      }
      .message.user .message-bubble {
        background: #3a3a3a;
        color: #f2f2f2;
        border: 1px solid #4a4a4a;
      }
      .message.assistant .message-bubble {
        background: #222;
        color: #dcdcdc;
        border: 1px solid #333;
      }
      .message-meta {
        font-size: 11px;
        color: #666;
        margin-top: 6px;
      }
      .chat-footer {
        padding: 12px;
        border-top: 1px solid #2a2a2a;
        background: #121212;
      }
      .chat-input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #2a2a2a;
        background: #0f0f0f;
        color: #f2f2f2;
        outline: none;
        resize: none;
        min-height: 60px;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.4;
      }
      .chat-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
      }
      .chat-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
      }
      .chat-hint {
        font-size: 12px;
        color: #666;
      }
      .send-btn {
        padding: 10px 14px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
        color: #fff;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .send-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }
      .send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
        background: #555;
      }
    </style>
    <link rel="stylesheet" href="/static/css/app.css">
  </head>
  <body class="page-qimen">
    <div class="wrap">
      <a href="/analysis" class="back-btn">返回分析页</a>
      <h1 style="margin: 0 0 14px">奇门遁甲排盘（时家奇门）</h1>
      <div class="card">
        <div class="row">
          <input id="q" type="text" placeholder="请输入占卜问题（必填）" />
          <label><input id="useNow" type="checkbox" checked />使用当前时间</label>
          <input id="dt" type="datetime-local" />
          <button id="go">开始起盘</button>
          <button id="again" disabled>再起一次</button>
        </div>
        <div id="anim" class="stage" style="display:none">
          <video id="v" muted playsinline preload="metadata"></video>
          <div id="fb" class="fallback"><div class="spinner"></div></div>
        </div>
        <div id="info" style="margin-top: 16px; display:none" class="fade-in"></div>
        <div id="grid" class="grid9" style="display:none"></div>
        <div class="muted" style="margin-top: 10px">
          <small>结果会归入奇门记录，便于后续追问延续同一问题。</small>
        </div>
      </div>

      <!-- AI Chat Window -->
      <div id="qimenChat" class="chat-container" style="display:none;">
        <div class="chat-header">
          <div class="chat-title">
            <span>💬</span>
            <span>奇门 AI 解盘</span>
          </div>
          <div class="chat-modes">
            <button class="mode-btn active" data-style="professional" onclick="setQimenChatStyle(this)">专业</button>
            <button class="mode-btn" data-style="interpretation" onclick="setQimenChatStyle(this)">通俗</button>
          </div>
        </div>
        <div class="chat-body">
          <div id="qimenMessages" class="message-list"></div>
        </div>
        <div class="chat-footer">
          <textarea id="qimenChatInput" class="chat-input" placeholder="例如：这个盘对我的财运有什么启示？"></textarea>
          <div class="chat-actions">
            <div class="chat-hint">起盘后可开始提问，支持记忆与追问</div>
            <button id="qimenSendBtn" class="send-btn" onclick="sendQimenChat()">发送</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      let qimenChatStyle = 'professional';
      let currentChart = null;

      function wuxingOf(position) {
        const map = {1:'水',2:'土',3:'木',4:'木',5:'土',6:'金',7:'金',8:'土',9:'火'};
        return map[position] || '土';
      }

      function palaceName(position) {
        const map = {1:'坎',2:'坤',3:'震',4:'巽',5:'中',6:'乾',7:'兑',8:'艮',9:'离'};
        return map[position] || '中';
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }

      const layout = [
        [4, 9, 2],
        [3, 5, 7],
        [8, 1, 6]
      ];

      const q = document.getElementById('q');
      const useNow = document.getElementById('useNow');
      const dt = document.getElementById('dt');
      const go = document.getElementById('go');
      const again = document.getElementById('again');
      const anim = document.getElementById('anim');
      const v = document.getElementById('v');
      const fb = document.getElementById('fb');
      const info = document.getElementById('info');
      const grid = document.getElementById('grid');

      v.src = '/static/qimen.mp4';
      v.addEventListener('error', () => { fb.style.display = 'flex'; });
      v.addEventListener('canplaythrough', () => { fb.style.display = 'none'; });

      function nowLocalForInput() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }
      dt.value = nowLocalForInput();

      function getTargetTime() {
        if (useNow.checked) return new Date();
        return new Date(dt.value);
      }

      function render(chartData, question) {
        currentChart = chartData; // 保存当前盘面

        info.style.display = 'block';
        info.innerHTML = `
          <div class="muted">问题：${escapeHtml(question)}</div>
          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top: 8px">
            <span class="pill">年：${chartData.year}</span>
            <span class="pill">月：${chartData.month}</span>
            <span class="pill">日：${chartData.day}</span>
            <span class="pill">时：${chartData.hour}</span>
            <span class="pill">${chartData.escapeType === 'yang' ? '阳遁' : '阴遁'} ${chartData.bureauNumber} 局</span>
            <span class="pill">值符：${chartData.dutyChief}</span>
            <span class="pill">值使：${chartData.dutyDoor}</span>
          </div>
          <div class="muted" style="margin-top: 8px">${chartData.keyPoints.map(escapeHtml).join(' / ')}</div>
        `;

        grid.style.display = 'grid';
        grid.innerHTML = '';
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            const pos = layout[r][c];
            const p = chartData.palaces.find(x => x.position === pos);
            const delay = (r * 3 + c) * 50;
            const el = document.createElement('div');
            el.className = 'cell';
            el.style.transitionDelay = `${delay}ms`;
            el.innerHTML = `
              <div class="cell-top">${escapeHtml(p.deity || '')}</div>
              <div class="cell-main">
                <div class="meta">
                  <div class="stem">${escapeHtml(p.heavenStem)}</div>
                  <div>星：${escapeHtml(p.star)}</div>
                  <div>门：${escapeHtml(p.door)}</div>
                  <div class="muted">地盘：${escapeHtml(p.earthStem)}</div>
                </div>
                <div class="corner">
                  <div class="palace">${palaceName(pos)}</div>
                  <div class="wuxing">${wuxingOf(pos)}</div>
                </div>
              </div>
            `;
            grid.appendChild(el);
            requestAnimationFrame(() => { el.classList.add('in'); });
          }
        }

        // 显示聊天窗口
        document.getElementById('qimenChat').style.display = 'flex';
        loadQimenChatHistory();
      }

      async function run() {
        const question = q.value.trim();
        if (!question) return;

        go.disabled = true;
        again.disabled = true;
        info.style.display = 'none';
        grid.style.display = 'none';
        grid.innerHTML = '';

        anim.style.display = 'block';
        fb.style.display = 'none';

        let ended = false;
        const onEnded = () => { ended = true; };
        v.addEventListener('ended', onEnded, { once: true });
        v.loop = false;

        try { await v.play(); } catch { fb.style.display = 'flex'; }

        // API 调用
        try {
            const targetTime = getTargetTime();
            const response = await fetch('/api/qimen/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    date_time: targetTime.toISOString(),
                    question: question
                })
            });
            
            if (!response.ok) throw new Error('API Request Failed');
            const result = await response.json();
            if (!result.success) throw new Error(result.error);

            // 等待视频播放结束或超时
            const timeoutId = setTimeout(() => { ended = true; }, 8000);
            
            const tick = () => {
                if (!ended) return requestAnimationFrame(tick);
                clearTimeout(timeoutId);
                try { v.pause(); v.currentTime = 0; } catch {}
                anim.style.display = 'none';
                
                render(result.data, question);
                
                go.disabled = false;
                again.disabled = false;
            };
            tick();
            
        } catch (error) {
            console.error(error);
            anim.style.display = 'none';
            info.style.display = 'block';
            info.innerHTML = `<div style="color:#ff6b6b">起盘失败：${escapeHtml(error.message)}</div>`;
            go.disabled = false;
            again.disabled = false;
        }
      }

      go.addEventListener('click', run);
      again.addEventListener('click', run);
      q.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
      useNow.addEventListener('change', () => { dt.disabled = useNow.checked; });
      dt.disabled = useNow.checked;

      // Chat Functions
      window.setQimenChatStyle = function(btn) {
        document.querySelectorAll('.chat-modes .mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        qimenChatStyle = btn.dataset.style;
      }

      function appendQimenMessage(role, content, timestamp) {
        const messagesDiv = document.getElementById('qimenMessages');
        const messageEl = document.createElement('div');
        messageEl.classList.add('message', role);
        messageEl.innerHTML = `
          <div class="message-bubble">${escapeHtml(content)}</div>
          <div class="message-meta">${new Date(timestamp).toLocaleTimeString()}</div>
        `;
        messagesDiv.appendChild(messageEl);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      window.sendQimenChat = async function() {
        const input = document.getElementById('qimenChatInput');
        const message = input.value.trim();
        if (!message || !currentChart) return;

        const sendBtn = document.getElementById('qimenSendBtn');
        sendBtn.disabled = true;
        input.value = '';

        appendQimenMessage('user', message, new Date().toISOString());

        try {
          const response = await fetch('/api/qimen/chat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: message,
              chart: currentChart,
              style: qimenChatStyle
            })
          });
          const data = await response.json();
          if (data.success) {
            appendQimenMessage('assistant', data.reply, new Date().toISOString());
          } else {
            appendQimenMessage('assistant', `抱歉，解盘时遇到问题：${data.error}`, new Date().toISOString());
          }
        } catch (error) {
          appendQimenMessage('assistant', `抱歉，网络连接错误，请稍后再试。`, new Date().toISOString());
        } finally {
          sendBtn.disabled = false;
        }
      }
      
      async function loadQimenChatHistory() {
        try {
            const response = await fetch('/api/qimen/chat/history');
            const data = await response.json();
            const messagesDiv = document.getElementById('qimenMessages');
            messagesDiv.innerHTML = '';
            if (data.success && data.history) {
                data.history.forEach(msg => {
                    appendQimenMessage(msg.role, msg.content, msg.timestamp);
                });
            }
        } catch (error) {
            console.error("无法加载聊天历史:", error);
        }
      }

      document.getElementById('qimenChatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendQimenChat();
        }
      });
    </script>
  </body>
</html>
