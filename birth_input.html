<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出生资料 | 八字命理分析</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #d4af37;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --background-light: #f7fafc;
            --success-color: #38a169;
            --error-color: #e53e3e;
            --border-color: #e2e8f0;
            --shadow-soft: 0 4px 24px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            padding-top: 40px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            padding: 40px;
            width: 100%;
            max-width: 800px;
            min-height: 80vh;
            animation: slideInUp 0.8s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .form-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #ffffff;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
        }

        .date-grid {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1.5fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* 增强响应式设计 */
        @media (max-width: 768px) {
            .date-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            .time-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        @media (min-width: 769px) {
            .date-grid {
                grid-template-columns: 2fr 1.5fr 1.5fr;
                gap: 20px;
            }
            
            .time-grid {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
        }

        .form-select {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 44px;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
        }

        .form-select:invalid {
            border-color: #e53e3e;
        }

        .form-select option {
            padding: 8px;
            background: white;
            color: var(--text-primary);
        }

        .form-select option:hover,
        .form-select option:focus {
            background: var(--background-light);
        }

        .calendar-toggle {
            display: flex;
            background: var(--background-light);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .calendar-option {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 14px;
        }

        .calendar-option.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 2px 8px rgba(26, 54, 93, 0.3);
        }

        .gender-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .gender-option {
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .gender-option:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .gender-option.selected {
            border-color: var(--secondary-color);
            background: rgba(212, 175, 55, 0.1);
            color: var(--primary-color);
        }

        .submit-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 54, 93, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: rgba(26, 54, 93, 0.05);
            border-radius: 12px;
        }

        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(26, 54, 93, 0.3);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
        }

        .message.success {
            background: #d1fae5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }

        .help-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            padding: 12px;
            background: rgba(26, 54, 93, 0.05);
            border-radius: 8px;
            line-height: 1.5;
        }

        /* 全面响应式设计 */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 20px;
                margin: 0;
                max-width: 100%;
                border-radius: 16px;
            }

            .logo {
                font-size: 44px;
            }

            .title {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .date-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .time-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .gender-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .form-input,
            .form-select {
                padding: 14px;
                font-size: 16px;
            }

            .gender-option {
                padding: 16px;
            }

            .submit-btn {
                padding: 18px;
                font-size: 16px;
            }

            .calendar-option {
                padding: 10px;
                font-size: 13px;
            }

            .help-text {
                font-size: 11px;
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px;
                border-radius: 12px;
            }

            .section-title {
                font-size: 16px;
            }

            .form-label {
                font-size: 13px;
            }

            .form-input,
            .form-select {
                padding: 12px;
                font-size: 15px;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 900px;
                padding: 48px 60px;
            }
            
            .date-grid {
                grid-template-columns: 3fr 2fr 2fr;
                gap: 24px;
            }
            
            .time-grid {
                grid-template-columns: 1fr 1fr;
                gap: 24px;
            }
            
            .gender-grid {
                grid-template-columns: 1fr 1fr;
                gap: 24px;
            }
        }

        @media (min-width: 1200px) {
            body {
                padding: 40px;
            }
            
            .container {
                max-width: 1000px;
                padding: 60px 80px;
            }
        }

        /* 统一到当前产品视觉：米白底、红金点缀、克制边框与 8px 圆角 */

        .form-group {

<body class="page-birth">
    <div class="container">
        <nav class="top-nav">
            <div class="brand-mark">
                <span>八字命理分析</span>
            </div>
            <div class="nav-links">
                <a href="/home">首页</a>
                <a href="/analysis">分析页</a>
                <a href="/memory">记忆管理</a>
            </div>
        </nav>
        <div class="header">
            <h1 class="title">出生资料登记</h1>
            <p class="subtitle">填写或更新出生信息后，命盘、分析页和后续对话会使用同一份出生档案。</p>
        </div>

        <form id="birthInfoForm">
            <!-- 基本信息 -->
            <div class="form-section">
                <h3 class="section-title">
                    <span>👤</span>基本信息
                </h3>
                
                <div class="form-group">
                    <label class="form-label" for="userName">您的姓名</label>
                    <input type="text" id="userName" class="form-input" placeholder="请输入您的姓名" required>
                </div>

                <div class="form-group">
                    <label class="form-label">性别</label>
                    <div class="gender-grid">
                        <div class="gender-option" data-gender="1">
                            <div class="gender-symbol">男</div>
                            <div>男性</div>
                        </div>
                        <div class="gender-option" data-gender="0">
                            <div class="gender-symbol">女</div>
                            <div>女性</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 出生时间 -->
            <div class="form-section">
                <h3 class="section-title">
                    <span>📅</span>出生时间
                </h3>

                <div class="form-group">
                    <label class="form-label">历法选择</label>
                    <div class="calendar-toggle">
                        <button type="button" class="calendar-option active" data-calendar="solar">
                            阳历 (公历)
                        </button>
                        <button type="button" class="calendar-option" data-calendar="lunar">
                            农历 (阴历)
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">出生日期</label>
                    <div class="date-grid">
                        <select id="birthYear" class="form-select" required>
                            <option value="">选择年份</option>
                        </select>
                        <select id="birthMonth" class="form-select" required>
                            <option value="">选择月份</option>
                        </select>
                        <select id="birthDay" class="form-select" required>
                            <option value="">选择日期</option>
                        </select>
                    </div>
                    <div class="help-text">
                        📅 <strong>日期提示：</strong><br>
                        • 支持1900年至今的所有日期<br>
                        • 日期选择会自动处理闰年和每月天数<br>
                        • 请确保日期准确，这直接影响八字计算
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">出生时间</label>
                    <div class="time-grid">
                        <select id="birthHour" class="form-select" required>
                            <option value="">时</option>
                        </select>
                        <select id="birthMinute" class="form-select" required>
                            <option value="">分</option>
                        </select>
                    </div>
                    <div class="help-text">
                        💡 <strong>时间提示：</strong><br>
                        • 如果不确定具体出生时间，建议选择整点或半点<br>
                        • 早晚子时按传统规则处理（23:00-01:00为早子时）<br>
                        • 时间准确度直接影响八字计算的精准度
                    </div>
                </div>
            </div>

            <!-- 提交按钮 -->
            <div class="form-section">
                <button type="submit" class="submit-btn" id="submitBtn">
                    🚀 开始八字分析
                </button>
            </div>

            <!-- 加载状态 -->
            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <div>正在连接AI算命师，计算您的八字信息...</div>
            </div>

            <!-- 消息提示 -->
            <div class="message error" id="errorMessage"></div>
            <div class="message success" id="successMessage"></div>
        </form>
    </div>

    <script>
        // 全局状态变量
        let selectedCalendar = 'solar';
        let selectedGender = null;
        
        // DOM 元素引用
        let form, submitBtn, loading, errorMessage, successMessage;

        // 初始化日期时间选择器（增强版）
        function initializeDateTimeSelectors() {
            const currentYear = new Date().getFullYear();
            
            // 年份选择器 - 健壮性改进
            const yearSelect = document.getElementById('birthYear');
            yearSelect.innerHTML = '<option value="">选择年份</option>';
            
            // 生成年份选项（从当前年到1900年）
            for (let year = currentYear; year >= 1900; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year + '年';
                yearSelect.appendChild(option);
            }
            
            // 月份选择器 - 格式统一
            const monthSelect = document.getElementById('birthMonth');
            monthSelect.innerHTML = '<option value="">选择月份</option>';
            
            const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', 
                               '7月', '8月', '9月', '10月', '11月', '12月'];
            for (let month = 1; month <= 12; month++) {
                const option = document.createElement('option');
                option.value = month;
                option.textContent = monthNames[month - 1];
                monthSelect.appendChild(option);
            }
            
            // 日期选择器 - 初始状态
            const daySelect = document.getElementById('birthDay');
            daySelect.innerHTML = '<option value="">选择日期</option>';
            
            // 小时选择器 - 24小时制，格式统一
            const hourSelect = document.getElementById('birthHour');

        // 增强的日期处理函数
        function handleDateChange() {
            updateDayOptions();
            validateDate();
        }

        // 更新日期选项（增强版）
        function updateDayOptions() {
            console.log('开始更新日期选项...');
            
            const yearSelect = document.getElementById('birthYear');
            const monthSelect = document.getElementById('birthMonth');
            const daySelect = document.getElementById('birthDay');
            
            if (!yearSelect || !monthSelect || !daySelect) {
                console.error('日期选择器元素未找到');
                return;
            }
            
            const year = parseInt(yearSelect.value);
            const month = parseInt(monthSelect.value);
            
            console.log('当前选择的年月:', year, month);
            
            // 保存当前选中的日期
            const currentDay = parseInt(daySelect.value);
            
            // 清空并重建日期选项
            daySelect.innerHTML = '<option value="">选择日期</option>';
            
            if (year && month && year > 0 && month > 0) {
                // 计算该月的天数，处理闰年
                const daysInMonth = getDaysInMonth(year, month);
                console.log(`${year}年${month}月有${daysInMonth}天`);
                
                for (let day = 1; day <= daysInMonth; day++) {
                    const option = document.createElement('option');
                    option.value = day;
                    option.textContent = day + '日';
                    
                    // 为特殊日期添加说明
                    if (month === 2 && day === 29) {
                        option.textContent += ' (闰年)';
                    }
                    
                    daySelect.appendChild(option);
                }
                
                // 恢复之前选中的日期（如果仍然有效）
                if (currentDay && currentDay <= daysInMonth) {
                    daySelect.value = currentDay;
                    console.log('恢复之前选择的日期:', currentDay);
                } else {
                    // 默认选择1号
                    daySelect.value = 1;
                    console.log('设置默认日期: 1号');
                }
                
                console.log('日期选项更新完成');
            } else {
                console.log('年份或月份未选择，跳过日期更新');
            }
        }

        // 获取指定年月的天数
        function getDaysInMonth(year, month) {
            // 使用 JavaScript Date 对象来准确计算
            return new Date(year, month, 0).getDate();
        }

        // 日期验证函数
        function validateDate() {
            const yearSelect = document.getElementById('birthYear');
            const monthSelect = document.getElementById('birthMonth');
            const daySelect = document.getElementById('birthDay');
            
            const year = parseInt(yearSelect.value);
            const month = parseInt(monthSelect.value);
            const day = parseInt(daySelect.value);
            
            // 验证完整日期
            if (year && month && day) {
                const inputDate = new Date(year, month - 1, day);
                const currentDate = new Date();
                
                // 检查日期是否有效
                if (inputDate.getFullYear() !== year || 
                    inputDate.getMonth() !== month - 1 || 
                    inputDate.getDate() !== day) {
                    showDateError('输入的日期无效，请重新选择');
                    return false;
                }
                
                // 检查是否为未来日期
                if (inputDate > currentDate) {
                    showDateError('出生日期不能是未来的日期');
                    return false;
                }
                
                // 检查是否过于久远
                const minDate = new Date(1900, 0, 1);
                if (inputDate < minDate) {
                    showDateError('出生日期不能早于1900年');
                    return false;
                }
                
                hideDateError();
                return true;
            }
            
            return false;
        }

        function showDateError(message) {

        // 日期时间格式化（修复时区问题）
        function formatDateTime(year, month, day, hour, minute, isLunar = false) {
            if (!year || !month || !day || hour === '' || minute === '') {
                return null;
            }

            if (isLunar) {
                const hours = String(hour).padStart(2, '0');
                const minutes = String(minute).padStart(2, '0');
                return `${year}-${month}-${day} ${hours}:${minutes}:00`;
            } else {
                // 修复时区问题：直接构造北京时间的ISO字符串
                const yearStr = String(year).padStart(4, '0');
                const monthStr = String(month).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const hourStr = String(hour).padStart(2, '0');
                const minuteStr = String(minute).padStart(2, '0');
                
                const isoString = `${yearStr}-${monthStr}-${dayStr}T${hourStr}:${minuteStr}:00+08:00`;
                
                console.log(`时间格式化: ${year}-${month}-${day} ${hour}:${minute} -> ${isoString}`);
                return isoString;
            }
        }

        // 增强的表单验证（修复null值处理）
        function validateForm(formData) {
            console.log('🔍 开始验证表单数据:', formData);
            
            // 姓名验证
            if (!formData.name || formData.name.trim().length === 0) {
                console.log('❌ 姓名验证失败');
                return '请输入您的姓名';
            }
            if (formData.name.trim().length > 10) {
                console.log('❌ 姓名长度超限');
                return '姓名长度不能超过10个字符';
            }
            
            // 日期验证 - 修复null值检查
            if (!formData.year || !formData.month || !formData.day || 
                isNaN(formData.year) || isNaN(formData.month) || isNaN(formData.day)) {
                console.log('❌ 日期验证失败:', {
                    year: formData.year,
                    month: formData.month,
                    day: formData.day
                });
                return '请选择完整的出生日期';
            }
            
            // 验证日期的有效性
            if (!validateDateRange(formData.year, formData.month, formData.day)) {
                console.log('❌ 日期范围验证失败');
                return '请输入有效的出生日期';
            }
            
            // 时间验证 - 修复null值检查
            if (formData.hour === null || formData.hour === undefined || isNaN(formData.hour) || 
                formData.minute === null || formData.minute === undefined || isNaN(formData.minute)) {
                console.log('❌ 时间验证失败:', {
                    hour: formData.hour,
                    minute: formData.minute
                });
                return '请选择出生时间';
            }
            
            // 时间范围验证
            if (formData.hour < 0 || formData.hour > 23 || 
                formData.minute < 0 || formData.minute > 59) {
                console.log('❌ 时间范围验证失败');
                return '请选择有效的出生时间';
            }
            
            // 性别验证
            if (formData.gender === null || formData.gender === undefined) {
                console.log('❌ 性别验证失败');
                return '请选择性别';
            }
            
            console.log('✅ 表单验证通过');
            return null;
        }

        // 日期范围验证
        function validateDateRange(year, month, day) {
            try {
                const inputDate = new Date(year, month - 1, day);
                const currentDate = new Date();
                const minDate = new Date(1900, 0, 1);
                
                // 检查日期构造是否正确
                if (inputDate.getFullYear() !== year || 
                    inputDate.getMonth() !== month - 1 || 
                    inputDate.getDate() !== day) {
                    return false;
                }
                
                // 检查日期范围
                return inputDate >= minDate && inputDate <= currentDate;
            } catch (error) {
                return false;
            }
        }

        // 消息显示
        function showMessage(type, message) {
            hideAllMessages();
            const messageElement = document.getElementById(type + 'Message');
            if (messageElement) {
                messageElement.textContent = message;
                messageElement.style.display = 'block';
            }
        }

        function hideAllMessages() {
            const errorMessage = document.querySelector('.message.error');
            const successMessage = document.querySelector('.message.success');
            if (errorMessage) errorMessage.style.display = 'none';
            if (successMessage) successMessage.style.display = 'none';
        }

        // 表单提交处理函数
        function setGenderValue(gender) {
            const normalized = parseInt(gender);
            if (Number.isNaN(normalized)) return;
            selectedGender = normalized;
            document.querySelectorAll('.gender-option').forEach(option => {
                option.classList.toggle('selected', parseInt(option.dataset.gender) === normalized);
            });
        }

        function setCalendarValue(calendar) {
            selectedCalendar = calendar === 'lunar' ? 'lunar' : 'solar';
            document.querySelectorAll('.calendar-option').forEach(option => {
                option.classList.toggle('active', option.dataset.calendar === selectedCalendar);
            });
        }

        function parseBirthParts(userInfo) {
            const rawBirth = String(userInfo.birth_time || userInfo.display_birth_time || '');
            const rawDate = String(userInfo.birth_date || '');
            const datePart = rawDate || (rawBirth.includes('T') ? rawBirth.split('T')[0] : rawBirth.split(' ')[0]);
            let timePart = '';
            if (rawBirth.includes('T')) {
                timePart = rawBirth.split('T')[1].replace(/\+.*$/, '').replace(/Z$/, '');
            } else if (rawBirth.includes(' ')) {
                timePart = rawBirth.split(' ')[1];
            } else if (/^\d{2}:\d{2}/.test(rawBirth)) {
                timePart = rawBirth;
            }
            const [year, month, day] = datePart.split('-').map(v => parseInt(v));
            const [hour, minute] = (timePart || '').split(':').map(v => parseInt(v));
            return { year, month, day, hour, minute };
        }

        async function preloadExistingBirthProfile() {
            try {
                const response = await fetch('/api/user/bazi-data', {
                    method: 'GET',
                    credentials: 'same-origin',
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) return;
                const payload = await response.json();
                const userInfo = payload.user_info || {};
                if (!userInfo || !userInfo.user_id) return;

                const nameInput = document.getElementById('userName');
                if (nameInput && userInfo.name) {
                    nameInput.value = userInfo.name;
                }
                setGenderValue(userInfo.gender);
                setCalendarValue(userInfo.calendar_type);

                const parts = parseBirthParts(userInfo);
                const yearSelect = document.getElementById('birthYear');
                const monthSelect = document.getElementById('birthMonth');
                const daySelect = document.getElementById('birthDay');
                const hourSelect = document.getElementById('birthHour');
                const minuteSelect = document.getElementById('birthMinute');

                if (yearSelect && parts.year) yearSelect.value = String(parts.year);
                if (monthSelect && parts.month) monthSelect.value = String(parts.month);
                updateDayOptions();
                if (daySelect && parts.day) daySelect.value = String(parts.day);
                if (hourSelect && Number.isInteger(parts.hour)) hourSelect.value = String(parts.hour);
                if (minuteSelect && Number.isInteger(parts.minute)) minuteSelect.value = String(parts.minute);
                validateDate();
            } catch (error) {
                console.warn('预填出生资料失败:', error);
            }
        }

        function initializeFormSubmission() {
            const form = document.getElementById('birthInfoForm');
            if (!form) {
                console.error('表单元素未找到');
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAllMessages();
                
                console.log('📝 开始表单提交流程...');
                
                const formData = getCurrentFormData();
                const validationError = validateForm(formData);
                if (validationError) {
                    console.log('❌ 表单验证失败:', validationError);
                    showMessage('error', validationError);
                    return;
                }

                const isLunar = formData.calendar === 'lunar';
                console.log('📅 历法类型:', isLunar ? '农历' : '阳历');
                
                console.log('🔧 调用时间格式化函数...');
                const formattedDateTime = formatDateTime(
                    formData.year, formData.month, formData.day, 
                    formData.hour, formData.minute, isLunar
                );

                if (!formattedDateTime) {
                    console.log('❌ 时间格式化失败');
                    showMessage('error', '日期时间格式化失败，请检查输入');
                    return;
                }

                console.log('✅ 时间格式化成功:', formattedDateTime);

                const requestData = {
                    name: formData.name,
                    gender: formData.gender,
                    lunarDatetime: isLunar ? formattedDateTime : null,
                    solarDatetime: isLunar ? null : formattedDateTime,
                    earlyZiTimeRule: 1
                };
                
                console.log('📊 完整请求数据:', requestData);

                const submitBtn = document.getElementById('submitBtn');
                const loading = document.querySelector('.loading');
                
                submitBtn.disabled = true;
                loading.style.display = 'block';

                try {
                    console.log('调用八字API:', requestData);
                    
                    const baziResponse = await fetch('/api/bazi/get', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(requestData)
                    });

                    if (!baziResponse.ok) {
                        throw new Error(`八字API调用失败 (状态码: ${baziResponse.status})`);
                    }

                    const baziData = await baziResponse.json();
                    console.log('八字API响应:', baziData);

                    if (!baziData.success) {
                        throw new Error(baziData.error || '八字计算失败');
                    }

                    // 存储用户数据
                    const userData = {
                        userInfo: requestData,
                        baziData: baziData.data || baziData,
                        timestamp: new Date().toISOString()
                    };
                    
                    localStorage.setItem('currentUserData', JSON.stringify(userData));

                    showMessage('success', '✅ 八字信息计算成功！正在跳转到分析界面...');

                    // 跳转到分析界面
                    setTimeout(() => {
                        window.location.href = '/analysis-detail';
                    }, 2000);

                } catch (error) {
                    console.error('提交失败:', error);
                    showMessage('error', `❌ ${error.message}`);
                } finally {
                    submitBtn.disabled = false;
                    loading.style.display = 'none';
                }
            });
        }
