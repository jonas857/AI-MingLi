<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>六爻排盘 | 八字命理分析</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans SC", sans-serif; background: #0b0b0b; color: #f2f2f2; }
      .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
      .card { background: #121212; border: 1px solid #2a2a2a; border-radius: 16px; padding: 18px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      input[type="text"] { flex: 1; min-width: 240px; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2a2a; background: #0f0f0f; color: #f2f2f2; outline: none; }
      button { padding: 12px 14px; border-radius: 10px; border: 1px solid #3a3a3a; background: #1a1a1a; color: #f2f2f2; cursor: pointer; }
      button:disabled { opacity: .55; cursor: not-allowed; }
      .stage { width: 560px; height: 315px; max-width: 100%; background: #000; border-radius: 16px; overflow: hidden; position: relative; margin: 16px auto 0; border: 1px solid #2a2a2a; }
      .stage video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
      .spinner { width: 64px; height: 64px; border-radius: 999px; border: 4px solid #ff9900; border-top-color: transparent; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .fade-in { animation: fadeIn .28s ease-out both; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .muted { color: #b8b8b8; }
      .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 1px solid #2a2a2a; background: #0f0f0f; }
      .lines { display: grid; gap: 6px; }
      .line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 10px; border: 1px solid #242424; background: #0f0f0f; }
      .line strong { letter-spacing: 1px; }
      .back-btn { margin-bottom: 14px; display: inline-block; color: #aaa; text-decoration: none; }
      .back-btn:hover { color: #fff; }

      /* Chat Window Styles - 黑色主题 */
      .chat-container {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        height: 60vh;
        min-height: 400px;
      }
      .chat-header {
        padding: 12px 18px;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .chat-title {
        font-weight: 600;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #f2f2f2;
      }
      .chat-modes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chat-modes .mode-btn {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid #3a3a3a;
        background: transparent;
        font-size: 12px;
        color: #9CA3AF;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .chat-modes .mode-btn.active {
        border-color: rgba(212,57,44,0.5);
        background: rgba(212,57,44,0.15);
        color: #f2f2f2;
        font-weight: 600;
      }
      .chat-body {
        flex-grow: 1;
        overflow-y: auto;
        padding: 18px;
        background: #121212;
      }
      .message-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-height: 360px;
        overflow-y: auto;
      }
      .message {
        display: flex;
        flex-direction: column;
        max-width: 85%;
      }
      .message.user {
        align-self: flex-end;
        align-items: flex-end;
      }
      .message.assistant {
        align-self: flex-start;
        align-items: flex-start;
      }
      .message-bubble {
        padding: 12px 16px;
        border-radius: 14px;
        line-height: 1.6;
      }
      .message.user .message-bubble {
        background: #3a3a3a;
        color: #f2f2f2;
        border: 1px solid #4a4a4a;
      }
      .message.assistant .message-bubble {
        background: #222;
        color: #dcdcdc;
        border: 1px solid #333;
      }
      .message-meta {
        font-size: 11px;
        color: #666;
        margin-top: 6px;
      }
      .chat-footer {
        padding: 12px;
        border-top: 1px solid #2a2a2a;
        background: #121212;
      }
      .chat-input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #2a2a2a;
        background: #0f0f0f;
        color: #f2f2f2;
        outline: none;
        resize: none;
        min-height: 60px;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.4;
      }
      .chat-input:focus {
        border-color: #ff9900;
        box-shadow: 0 0 0 2px rgba(255, 153, 0, 0.15);
      }
      .chat-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
      }
      .chat-hint {
        font-size: 12px;
        color: #666;
      }
      .send-btn {
        padding: 10px 14px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #ff9900 0%, #ff6600 100%);
        color: #000;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .send-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(255, 153, 0, 0.3);
      }
      .send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
        background: #555;
      }
    </style>
    <link rel="stylesheet" href="/static/css/app.css">
  </head>
  <body class="page-liuyao">
    <div class="wrap">
      <a href="/analysis" class="back-btn">返回分析页</a>
      <h1 style="margin: 0 0 14px">六爻排盘（三钱起卦）</h1>
      <div class="card">
        <div class="row">
          <input id="q" type="text" placeholder="请输入占卜问题（必填）" />
          <button id="go">开始摇卦</button>
          <button id="again" disabled>再摇一次</button>
        </div>
        <div id="anim" class="stage" style="display:none">
          <video id="v" muted playsinline preload="metadata" loop></video>
          <div id="fb" class="fallback"><div class="spinner"></div></div>
        </div>
        <div id="out" class="grid" style="margin-top: 16px; display:none"></div>
        <div class="muted" style="margin-top: 10px">
          <small>结果会归入六爻记录，便于后续追问延续同一问题。</small>
        </div>
      </div>

      <!-- AI Chat Window -->
      <div id="liuyaoChat" class="chat-container" style="display:none;">
        <div class="chat-header">
          <div class="chat-title">
            <span>💬</span>
            <span>六爻 AI 解卦</span>
          </div>
          <div class="chat-modes">
            <button class="mode-btn active" data-style="professional" onclick="setLiuyaoChatStyle(this)">专业</button>
            <button class="mode-btn" data-style="interpretation" onclick="setLiuyaoChatStyle(this)">通俗</button>
          </div>
        </div>
        <div class="chat-body">
          <div id="liuyaoMessages" class="message-list"></div>
        </div>
        <div class="chat-footer">
          <textarea id="liuyaoChatInput" class="chat-input" placeholder="例如：这个卦象对我的事业有什么启示？"></textarea>
          <div class="chat-actions">
            <div class="chat-hint">起卦后可开始提问，支持记忆与追问</div>
            <button id="liuyaoSendBtn" class="send-btn" onclick="sendLiuyaoChat()">发送</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      const YAO_TYPES = {
        6: { name: '老阴', symbol: '⚋', isMoving: true },
        7: { name: '少阳', symbol: '⚊', isMoving: false },
        8: { name: '少阴', symbol: '⚋', isMoving: false },
        9: { name: '老阳', symbol: '⚊', isMoving: true }
      };

      let liuyaoChatStyle = 'professional';
      let currentGua = null;

      function yaoName(i) {
        return ['初', '二', '三', '四', '五', '上'][i];
      }

      function renderResult(result, question) {
        const out = document.getElementById('out');
        out.style.display = 'grid';
        out.classList.add('fade-in');

        currentGua = result; // 保存当前卦象

        const original = result.originalHexagram;
        const changed = result.changedHexagram;
        const movingLines = result.movingLines || [];

        const lines = [];
        for (let i = 5; i >= 0; i--) {
          const position = i + 1;
          const yaoValue = original.yaos[i];
          const yaoType = YAO_TYPES[yaoValue];
          const isMoving = movingLines.includes(position);
          lines.push(`
            <div class="line">
              <div><strong>${yaoName(i)}爻</strong> <span class="mono">${yaoType.symbol}</span> <span class="muted">${yaoType.name}${isMoving ? '（动）' : ''}</span></div>
              <div class="muted">位置 ${position}</div>
            </div>
          `);
        }

        out.innerHTML = `
          <div class="grid">
            <div class="muted">问题：${escapeHtml(question)}</div>
            <div style="display:flex; gap:10px; flex-wrap:wrap">
              <span class="pill">本卦：${original.name}</span>
              <span class="pill">卦号：${original.number}</span>
              <span class="pill">世：${result.worldYao} 爻</span>
              <span class="pill">应：${result.responseYao} 爻</span>
              <span class="pill">动爻：${movingLines.length ? movingLines.join(',') : '无'}</span>
            </div>
            ${changed ? `<div style="display:flex; gap:10px; flex-wrap:wrap"><span class="pill">变卦：${changed.name}</span><span class="pill">卦号：${changed.number}</span></div>` : ''}
            <div class="lines">${lines.join('')}</div>
          </div>
        `;
        
        // 显示聊天窗口
        document.getElementById('liuyaoChat').style.display = 'flex';
        loadLiuyaoChatHistory();
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }

      const q = document.getElementById('q');
      const go = document.getElementById('go');
      const again = document.getElementById('again');
      const anim = document.getElementById('anim');
      const v = document.getElementById('v');
      const fb = document.getElementById('fb');
      const out = document.getElementById('out');

      // 使用站内静态资源
      v.src = '/static/liuyao.mp4';
      v.addEventListener('error', () => { fb.style.display = 'flex'; });
      v.addEventListener('canplaythrough', () => { fb.style.display = 'none'; });

      async function run() {
        const question = q.value.trim();
        if (!question) return;

        go.disabled = true;
        again.disabled = true;
        out.style.display = 'none';
        out.innerHTML = '';
        anim.style.display = 'block';
        fb.style.display = 'none';

        try { await v.play(); } catch { fb.style.display = 'flex'; }

        // 调用后端 API 获取结果
        try {
            const response = await fetch('/api/liuyao/calculate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    method: 'coins',
                    question: question,
                    divination_time: new Date().toISOString()
                })
            });
            
            if (!response.ok) {
                throw new Error('API request failed');
            }
            
            const data = await response.json();
            if (!data.success) {
                throw new Error(data.error || 'Unknown error');
            }
            
            setTimeout(() => {
                anim.style.display = 'none';
                try { v.pause(); v.currentTime = 0; } catch {}
                
                renderResult(data.data, question);
                
                go.disabled = false;
                again.disabled = false;
            }, 3000); // 保持3秒动画时间

        } catch (error) {
            console.error('Error:', error);
            anim.style.display = 'none';
            out.style.display = 'block';
            out.innerHTML = `<div class="muted" style="color: #ff6b6b">起卦失败：${escapeHtml(error.message)}</div>`;
            go.disabled = false;
            again.disabled = false;
        }
      }

      go.addEventListener('click', run);
      again.addEventListener('click', () => {
        q.focus();
        run();
      });
      q.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });

      // Chat Functions
      window.setLiuyaoChatStyle = function(btn) {
        document.querySelectorAll('.chat-modes .mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        liuyaoChatStyle = btn.dataset.style;
      }

      function appendLiuyaoMessage(role, content, timestamp) {
        const messagesDiv = document.getElementById('liuyaoMessages');
        const messageEl = document.createElement('div');
        messageEl.classList.add('message', role);
        messageEl.innerHTML = `
          <div class="message-bubble">${escapeHtml(content)}</div>
          <div class="message-meta">${new Date(timestamp).toLocaleTimeString()}</div>
        `;
        messagesDiv.appendChild(messageEl);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      window.sendLiuyaoChat = async function() {
        const input = document.getElementById('liuyaoChatInput');
        const message = input.value.trim();
        if (!message || !currentGua) return;

        const sendBtn = document.getElementById('liuyaoSendBtn');
        sendBtn.disabled = true;
        input.value = '';

        appendLiuyaoMessage('user', message, new Date().toISOString());

        try {
          const response = await fetch('/api/liuyao/chat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: message,
              gua: currentGua,
              style: liuyaoChatStyle
            })
          });
          const data = await response.json();
          if (data.success) {
            appendLiuyaoMessage('assistant', data.reply, new Date().toISOString());
          } else {
            appendLiuyaoMessage('assistant', `抱歉，解卦时遇到问题：${data.error}`, new Date().toISOString());
          }
        } catch (error) {
          appendLiuyaoMessage('assistant', `抱歉，网络连接错误，请稍后再试。`, new Date().toISOString());
        } finally {
          sendBtn.disabled = false;
        }
      }
      
      async function loadLiuyaoChatHistory() {
        try {
            const response = await fetch('/api/liuyao/chat/history');
            const data = await response.json();
            const messagesDiv = document.getElementById('liuyaoMessages');
            messagesDiv.innerHTML = '';
            if (data.success && data.history) {
                data.history.forEach(msg => {
                    appendLiuyaoMessage(msg.role, msg.content, msg.timestamp);
                });
            }
        } catch (error) {
            console.error("无法加载聊天历史:", error);
        }
      }

      document.getElementById('liuyaoChatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendLiuyaoChat();
        }
      });
    </script>
  </body>
</html>
